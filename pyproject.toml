[project]
name = "originlab-mcp"
version = "0.2.1"
description = "OriginLab MCP Server - AI 驱动的 OriginLab 自动化控制"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    # Windows-only COM bridge; Linux/macOS sync/tests skip installing it.
    "originpro>=1.1.0; sys_platform == 'win32'",
]

[project.scripts]
originlab-mcp = "originlab_mcp.server:main"
originlab-mcp-ui = "originlab_mcp.ui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/originlab_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # 行长度由 line-length 控制

[tool.ruff.lint.isort]
known-first-party = ["originlab_mcp"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["originpro", "originpro.*", "originext", "originext.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--cov=originlab_mcp",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml:coverage.xml",
]

[tool.coverage.run]
branch = true
source = ["originlab_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
